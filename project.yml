# XcodeGen spec for Thermik (XcodeGen 2.46.0: `brew install xcodegen`, MIT).
# Regenerate after ANY change:  xcodegen generate   (Thermik.xcodeproj is git-ignored — never edit it by hand,
# never let Xcode "upgrade/convert" it; regenerate instead).
name: Thermik
options:
  bundleIdPrefix: app.thermik            # PLACEHOLDER (decision D3)
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "27.1"

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    MACOSX_DEPLOYMENT_TARGET: "14.0"

packages:
  ThermikCore:
    path: Packages/ThermikCore           # local SwiftPM package, products linked STATICALLY

targets:
  Thermik:
    type: application
    platform: macOS
    sources:
      - path: App                        # *.swift, Resources/Assets.xcassets,
        excludes:                        # Resources/Localizable.xcstrings (en + ru)
          - "Info.plist"
          - "Resources/L10n/**"          # translation fragments are build INPUTS, not bundle resources
      - path: Resources/LaunchDaemons/app.thermik.helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper         # $(WRAPPER_NAME) == Thermik.app
            subpath: Contents/Library/LaunchDaemons
    dependencies:
      - package: ThermikCore
        products: [ThermikCore, ThermikSMC, ThermikHelperShared]   # NOT ThermikSMCWriter (app has no SMC write path)
      - target: ThermikHelper
        embed: true
        codeSign: true
        copy:
          destination: executables       # → Thermik.app/Contents/MacOS/thermik-helper
    info:
      path: App/Info.plist               # generated by XcodeGen on every run (git-ignored)
      properties:
        CFBundleDisplayName: Thermik
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ru]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true                # menu bar agent: no Dock icon until a window opens
        LSApplicationCategoryType: public.app-category.utilities
        CFBundleURLTypes:                # P2 `thermik://` links (App/Runtime/URLRouter.swift)
          - CFBundleURLName: app.thermik.Thermik
            CFBundleURLSchemes: [thermik]
        NSHumanReadableCopyright: "© 2026 Thermik contributors. MIT License."
    entitlements:
      path: Resources/Thermik.entitlements
      properties: {}                     # NOT sandboxed: AppleSMC user client, IOReport, HID SPI, daemon registration
    settings:
      base:
        PRODUCT_NAME: Thermik
        PRODUCT_BUNDLE_IDENTIFIER: app.thermik.Thermik
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor   # empty colour set = system accent
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES

  ThermikHelper:
    type: tool                           # command-line tool embedded in the app
    platform: macOS
    sources:
      - path: Helper
        excludes: ["Info.plist"]
    dependencies:
      - package: ThermikCore
        products: [ThermikSMC, ThermikSMCWriter, ThermikHelperCore, ThermikHelperShared]
    info:
      path: Helper/Info.plist            # embedded as __TEXT,__info_plist → codesign identifier = CFBundleIdentifier
      properties:
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleName: thermik-helper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(HELPER_BUILD_VERSION)
    settings:
      base:
        PRODUCT_NAME: thermik-helper
        PRODUCT_BUNDLE_IDENTIFIER: app.thermik.helper   # == launchd Label == Mach service == signing identifier
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: ""

schemes:
  Thermik:
    build:
      targets:
        Thermik: all
        ThermikHelper: all
    run:
      config: Debug
      commandLineArguments:
        "-ThermikDemo NO": true          # flip to YES in the scheme editor for synthetic data
    archive:
      config: Release
